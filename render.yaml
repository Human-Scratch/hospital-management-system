# Render Blueprint: New + > Blueprint > pick this GitHub repo. Creates the web app + PostgreSQL DB.
databases:
  - name: hms-db
    databaseName: hms
    plan: free
services:
  - type: web
    name: hospital-hms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py --if-empty && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
